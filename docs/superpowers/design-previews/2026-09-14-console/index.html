<script>

function steps(){return `<div class="steps"><div class="step done"><span>01</span>资料就绪</div><div class="step done"><span>02</span>缓存命中</div><div class="step now"><span>03</span>文章生成</div><div class="step"><span>04</span>审核与保存</div></div>`}

function a(){return head('任务工作台','同时管理 5 个独立任务，切换查看不会打断生成。',switcher('a'))+`<section class="panel"><div class="summary"><span>进行中 <b>3</b></span><span>待开始 <b>1</b></span><span>已暂停 <b>1</b></span><span class="grow"></span><span>工作区上限 <b>5 / 5</b></span><span class="tag">示例状态</span></div>${taskTable()}</section><div class="aside-detail"><section class="panel"><header class="panel-head between"><div class="row"><span class="tag">当前查看 01</span><h2>美迪教育 · 九月内容</h2></div><a href="#b" class="small" style="color:var(--blue)">进入工作区 →</a></header><div class="detail-body">${steps()}<div class="between" style="margin-bottom:10px"><h3>已完成文章</h3><span class="small muted">审核通过后保存文件 · 按任务逐条结算</span></div><div class="article-row"><span><span class="sheet-marker">MD</span>跨境电商培训机构选择指南</span><span class="tag green">已保存</span></div><div class="article-row"><span><span class="sheet-marker">MD</span>电商运营课程需要学习什么</span><button class="quiet small" data-demo="此处下载对应工作区的文章；草稿无真实文件。">下载文件 ↓</button></div><div class="article-row muted"><span>第三条任务正在生成，其他工作区继续运行</span><span class="mono small">03 / 05</span></div></div></section><aside class="panel companion"><span class="cap">LXUE ASSISTANT</span><h3 style="margin-top:10px">专注内容，其余有序。</h3><p>知识只取所需，文章各自归档。</p><div class="vertical-note">共享资料缓存<br>独立模型密钥<br>逐条任务结算</div><img src="${asset}lxue-geo-founder.png" alt="零雪形象人物" width="132" height="132"></aside></div>`}
function taskTabs(){return `<div class="task-tabs">${tasks.map((t,i)=>`<a href="#b" class="task-tab ${i===0?'active':''}" data-demo="草稿演示：实际版本将切换该工作区的资料、进度与文件。"><div class="between"><span class="mono">WORKSPACE ${t[0]}</span><span>${t[5]}</span></div><strong>${t[1]}</strong><div class="between"><span>${t[4]}</span><span>${t[3]}</span></div>${bar(t[6])}</a>`).join('')}</div>`}
function b(){return head('美迪教育 · 九月内容','五个工作区各自独立，当前展示第 1 个任务。',switcher('b'))+taskTabs()+`<div class="studio"><section class="studio-main"><div class="content-tabs"><span>资料与任务</span><span>运行进度</span><span class="active">文章文件 <b class="mono">2</b></span></div><header class="panel-head between"><div><span class="small muted">已保存文件 / 01</span><h3 style="margin-top:3px">跨境电商培训机构选择指南.md</h3></div><button data-demo="设计草稿不提供真实文章下载。">下载 MD ↓</button></header><article class="doc"><span class="tag green">审核通过 · 示例文章</span><h2 style="margin-top:16px">跨境电商培训机构如何选择？</h2><p>选择培训机构，可以先从课程内容、实践机会以及教学支持三个方面进行比较，再结合自己的学习基础与目标作出判断。</p><div class="source-note">资料来源：站点 IMA 共享缓存 / 美迪教育品牌资料<br>本文仅用于排版展示，不是实际生成结果。</div><h3>01　先明确学习目标，再比较课程</h3><p>把学习目标拆分为平台操作、内容策划和运营分析，逐项确认课程能否覆盖。阅读课程介绍时，也需要关注实际练习与答疑安排。</p><div class="line"></div><div class="between small muted" style="margin-top:18px"><span>所属任务 01 · 内容独立保存</span><span>第 1 篇 / 已完成 2 篇</span></div></article></section><aside class="studio-side"><section class="panel"><div class="side-section between"><h3>任务运行</h3>${badge('生成中','green')}</div><div class="side-section"><div class="between small"><span>完整输出</span><span class="mono">2 / 5</span></div><div style="margin:10px 0 18px">${bar(40)}</div><div class="kv"><span>所用模型</span><b>DeepSeek · 已锁定</b></div><div class="kv"><span>IMA 资料</span><b style="color:var(--green)">缓存命中</b></div><div class="kv"><span>预扣积分</span><b class="mono">5</b></div><div class="kv"><span>已返还</span><b class="mono">0</b></div></div><div class="side-section"><button style="width:100%" data-demo="只暂停此工作区，其他任务继续。">暂停此任务</button><p class="small muted" style="margin-top:10px">当前请求结束后暂停。已生成的文章会保留。</p></div></section><div class="tiny-character"><img src="${asset}lxue-geo-founder.png" alt="零雪形象人物" width="64" height="64"><div><h3>零雪陪你完成创作</h3><p>文件保存后才算完成</p></div></div></aside></div>`}
function settingsNav(owner=false,active='models'){const entries=owner?[['members','子账号管理'],['credits','积分调整'],['expiry','有效期与续期'],['ima','IMA 凭据'],['cache','共享缓存'],['audit','操作记录']]:[['models','模型与 API'],['security','登录与安全'],['billing','积分与有效期'],['contact','联系与续费']];return `<aside class="settings-nav"><div class="nav-label">${owner?'站点管理 · 仅总账号':'个人设置'}</div>${entries.map(([id,label])=>`<a href="#${owner?'owner':id==='security'?'security':'settings'}" class="${id===active?'active':''}" ${id!==active&&id!=='security'?'data-demo="目录式页面示意：每项功能独立展示，不堆在同一页。"':''}>${label}</a>`).join('')}<div class="nav-label" style="margin-top:35px">${owner?'成员无此目录及接口权限':'只管理当前账号'}</div></aside>`}
function settings(){return head('个人设置','模型连接、账号安全与服务信息，各自独立。',badge(member?'子账号视角':'总账号也使用个人设置'))+`<section class="panel settings-shell">${settingsNav()}<div class="settings-body"><h2>模型与 API</h2><p>使用你自己的模型密钥；站点共享知识库由零雪维护。</p><div class="setting-row"><div><strong>默认生成模型</strong><p>只影响尚未启动的任务，运行中的任务不变。</p></div><button data-demo="保留现有 API 配置方式，本草稿只调整分区。">DeepSeek　⌄</button></div><div class="setting-row"><div class="row"><img class="model-symbol" src="${asset}model-logos/deepseek.png" width="29" height="29" alt="DeepSeek"><div><strong>DeepSeek</strong><p>API 密钥已配置</p></div></div><div class="row">${badge('已配置','green')}<button data-demo="正式版使用现有 API 设置功能。">编辑连接</button></div></div><div class="setting-row"><div class="row"><img class="model-symbol" src="${asset}model-logos/kimi.png" width="29" height="29" alt="Kimi"><div><strong>Kimi</strong><p>使用当前账号自己的 API Key</p></div></div><button data-demo="保留现有模型厂商和自定义模型选项。">配置 API</button></div><div class="setting-row"><div><strong>其他模型厂商</strong><p>混元、千问、豆包、智谱、MiniMax、小米</p></div><button data-demo="正式版进入现有厂商配置目录。">管理连接 →</button></div><div class="settings-notice">这里不包含子账号开通、积分发放或 IMA 密钥维护。总账号请前往独立的「管理中心」。</div></div></section>`}
function owner(){return head('管理中心','只对你的总账号开放；成员无法查看或操作。',badge('OWNER ONLY'))+`<section class="panel settings-shell">${settingsNav(true,'members')}<div class="settings-body"><div class="settings-top between"><div><h2>子账号管理</h2><p class="small muted" style="margin-top:4px">开通账号，分配积分，按账号管理 30 天服务。</p></div><button class="primary" data-demo="设计演示：开通表单将放在独立抽屉，确认后创建。">＋ 开通子账号</button></div><div class="owner-grid"><div><div class="setting-row" style="padding-top:0"><input aria-label="搜索子账号" placeholder="搜索账号名称…"><span class="small muted">示例 3 个账号</span></div><table><thead><tr><th>账号</th><th>积分</th><th>有效期至</th><th>状态</th></tr></thead><tbody><tr class="selected"><td>demo_editor</td><td class="mono">120</td><td class="mono">10.14</td><td>${badge('有效','green')}</td></tr><tr><td>demo_brand</td><td class="mono">85</td><td class="mono">10.08</td><td>${badge('有效','green')}</td></tr><tr><td>demo_trial</td><td class="mono">0</td><td class="mono">09.14</td><td>${badge('待续期','amber')}</td></tr></tbody></table><div class="settings-notice">充值通过现有微信二维码联系你，由总账号手动调整。站点不接入在线支付。</div></div><aside class="owner-card"><span class="small muted">当前选中</span><h3 style="margin-top:5px">demo_editor</h3><div class="kv"><span>账号类型</span><b>普通成员</b></div><div class="kv"><span>可用积分</span><b>120</b></div><div class="kv"><span>服务周期</span><b>30 天</b></div><button data-demo="积分调整独立页面；提交前确认目标账号和金额。">调整积分</button><button data-demo="续期独立页面；显示当前与调整后的到期时间。">调整有效期</button><p class="small muted" style="margin-top:15px">每次变更记录操作者、时间和备注。</p></aside></div></div></section>`}
function security(){return head('个人设置','登录策略草稿，确认后再实施。')+`<section class="panel settings-shell">${settingsNav(false,'security')}<div class="settings-body"><h2>登录与安全</h2><p>取消默认七天自动进入，明确每次登录与退出状态。</p><div class="setting-row"><div><strong>进入登录页</strong><p>始终要求输入密码并主动点击登录，不自动提交或跳转。</p></div>${badge('必须验证')}</div><div class="setting-row"><div><strong>会话验证</strong><p>账号权限由服务端校验，不能靠前端隐藏页面代替。</p></div>${badge('服务端校验')}</div><div class="setting-row"><div><strong>退出登录</strong><p>撤销会话、清空账号视图；迟到的旧请求不能重新进入。</p></div>${badge('撤销旧会话')}</div><div class="setting-row"><div><strong>高风险管理操作</strong><p>开通成员、调整积分等操作需近期密码验证。</p></div>${badge('再次验证')}</div><div class="settings-notice">会话有效期、页面刷新与新标签页的行为需要一起验收，避免误退出中断任务。</div></div></section>`}
function login(){return `<div class="login-draft"><div class="login-art"><img src="${asset}lxue-login-mascot.png" alt="欢迎你的零雪形象人物" width="275" height="275"><h2>让好内容，被 AI 看见。</h2><p>你的灵感，零雪陪你一起实现。</p></div><section class="login-box"><span class="cap">LXUE · GEO WORKSPACE</span><h1 style="margin-top:15px">登录创作工作台</h1><p>输入账号和密码，进入你的独立空间。</p><label>账号<input autocomplete="username" placeholder="请输入账号"></label><label>密码<input type="password" autocomplete="current-password" placeholder="请输入密码"></label><p class="security">请验证密码后进入，本页面不会自动跳转。</p><button class="primary" data-demo="这是登录草稿，不收集、不提交任何账号或密码。">登录工作台 →</button><p class="login-note" style="margin-top:24px">自己的模型 API · 共享知识库<br>任务与文件按账号独立保存</p></section></div>`}
function render(){let mode=location.hash.slice(1)||'a';if(mode==='member'){member=!member;mode='settings'}if(mode==='owner'&&member){notice('子账号没有管理中心访问权限。草稿只演示隐藏，正式版本还必须服务端拒绝。');mode='settings'}if(!['a','b','settings','owner','login','security'].includes(mode)){notice('此入口保留原功能，本次展示核心页面设计。');mode='a'}document.querySelector('#main').innerHTML=({a,b,settings,owner,login,security}[mode])();document.querySelector('#breadcrumb').textContent={a:'任务总览',b:'任务工作区 / 01',settings:'个人设置 / 模型与 API',owner:'管理中心 / 子账号',login:'登录预览',security:'个人设置 / 登录与安全'}[mode];document.querySelectorAll('.owner-only').forEach(n=>n.hidden=member);document.querySelector('.role-label').textContent=member?'子账号':'总账号';document.querySelectorAll('[data-main]').forEach(n=>n.classList.toggle('active',n.dataset.main.split(',').includes(mode)));window.scrollTo(0,0)}
document.addEventListener('click',event=>{const target=event.target.closest('[data-demo]');if(target){event.preventDefault();notice(target.dataset.demo)}});window.addEventListener('hashchange',render);render();
function loginPresentation(){document.body.classList.toggle('login-preview',location.hash==='#login')}
window.addEventListener('hashchange',loginPresentation);loginPresentation();
</script>
</body>
</html>
